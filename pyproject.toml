[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "iara"
version = "0.2.0"
description = "AI-driven patient intake and triage assistant built with Python, Pydantic, and Google GenAI."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=3.6.1",
    "openai>=3.58.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
iara = "iara.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/iara"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
